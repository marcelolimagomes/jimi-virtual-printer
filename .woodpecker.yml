when:
  - event: [push, pull_request, tag]

steps:
  package-and-smoke:
    image: debian:bookworm
    commands:
      - apt-get update
      - >-
        apt-get install -y --no-install-recommends
        build-essential debhelper dh-python dpkg-dev
        python3 python3-pil python3-pytest python3-qrcode python3-reportlab
        poppler-utils zbar-tools
      - python3 -m pytest -q
      - scripts/build-deb.sh
      - apt-get install -y --no-install-recommends ./dist/posvirtual_*.deb
      - python3 /usr/libexec/posvirtual/smoke-deb.py artifacts/woodpecker
