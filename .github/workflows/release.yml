name: Release Debian package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or complete (for example v0.1.2-1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      package_version: ${{ steps.package.outputs.version }}
      release_tag: ${{ steps.package.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Debian build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python dpkg-dev \
            python3 python3-pil python3-pytest python3-qrcode python3-reportlab \
            gh poppler-utils zbar-tools

      - name: Build, validate, and smoke-test package
        id: package
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          version="$(dpkg-parsechangelog -S Version)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Tag $RELEASE_TAG precisa corresponder ao changelog: v$version" >&2
            exit 1
          fi

          scripts/build-deb.sh
          package="dist/posvirtual_${version}_all.deb"
          sudo apt-get install -y --no-install-recommends "./$package"
          python3 /usr/libexec/posvirtual/smoke-deb.py artifacts/release
          (cd dist && sha256sum -c "${package##*/}.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish package and checksum to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.package.outputs.version }}"
          package="dist/posvirtual_${version}_all.deb"
          checksum="$package.sha256"
          notes="dist/release-notes.md"
          cat > "$notes" <<EOF
          Taskblu POSvirtual ${version} installers for Debian/Ubuntu and Windows 10/11.

          Download the Debian package and its checksum, then verify with:

          ~~~sh
          sha256sum -c posvirtual_${version}_all.deb.sha256
          ~~~
          EOF

          tag="${{ steps.package.outputs.release_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$package" "$checksum" --clobber
          else
            gh release create "$tag" "$package" "$checksum" \
              --verify-tag \
              --title "Taskblu POSvirtual ${version}" \
              --notes-file "$notes"
          fi

  windows-installer:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer matching the release tag
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.release.outputs.package_version }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($tagVersion -ne $env:PACKAGE_VERSION) {
            throw "Tag $env:RELEASE_TAG precisa corresponder ao changelog: v$env:PACKAGE_VERSION"
          }
          $appVersion = $env:PACKAGE_VERSION -replace '-\d+$', ''
          $setupScript = Get-Content 'packaging/windows/posvirtual.iss' -Raw
          $appMatch = [regex]::Match($setupScript, '(?m)^#define AppVersion "([^"]+)"')
          $fileVersionMatch = [regex]::Match($setupScript, '(?m)^VersionInfoVersion=([0-9.]+)$')
          if (-not $appMatch.Success -or $appMatch.Groups[1].Value -ne $appVersion) {
            throw "AppVersion do instalador precisa ser $appVersion."
          }
          if (-not $fileVersionMatch.Success -or $fileVersionMatch.Groups[1].Value -ne "$appVersion.0") {
            throw "VersionInfoVersion do instalador precisa ser $appVersion.0."
          }
          ./packaging/windows/build.ps1

      - name: Publish Windows installer and checksum to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          $installers = @(Get-ChildItem 'dist/windows/installer/POSvirtual-Setup-*.exe')
          if ($installers.Count -ne 1) { throw "Esperado um instalador Windows; encontrados $($installers.Count)." }
          $installer = $installers[0]
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $checksum = "$($installer.FullName).sha256"
          Set-Content -Path $checksum -Value "$hash  $($installer.Name)" -Encoding ascii
          gh release upload $env:RELEASE_TAG $installer.FullName $checksum --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha publicando o instalador Windows." }
